{% extends 'base.html' %}
{% block title %}404 Page Not Found | EventHub{% endblock %}

{% block content %}
<div class="container section-padding">
    <div class="error-page-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">Oops! The event or page you are looking for doesn't exist or has been moved.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-primary btn-lg"><i class="fa-solid fa-house"></i> Return to Home</a>
            <a href="{% url 'event_list' %}" class="btn btn-outline btn-lg"><i class="fa-solid fa-compass"></i> Explore Events</a>
        </div>
    </div>
</div>
{% endblock %}
